name: TV screenshots

on:
  schedule:
    - cron: "*/15 * * * *"   # backup: restarts the chain if it ever stops
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write             # lets each run start the next run

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
    steps:
      - name: Note start time
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium

      - name: Copy TV pages
        run: |
          mkdir -p _site
          cp *.html _site/

      - name: Take screenshots
        env:
          PBI_TV1: ${{ secrets.PBI_TV1 }}
          PBI_TV2: ${{ secrets.PBI_TV2 }}
          PBI_TV3: ${{ secrets.PBI_TV3 }}
          PBI_TV4: ${{ secrets.PBI_TV4 }}
          PBI_TV5: ${{ secrets.PBI_TV5 }}
          PBI_TV6: ${{ secrets.PBI_TV6 }}
          PBI_ROTATE: ${{ secrets.PBI_ROTATE }}
          PBI_ROT_34: ${{ secrets.PBI_ROT_34 }}
          PBI_ROT_7: ${{ secrets.PBI_ROT_7 }}
          PBI_ROT_811: ${{ secrets.PBI_ROT_811 }}
          PBI_ROT_910: ${{ secrets.PBI_ROT_910 }}
          PBI_ROT_TV10: ${{ secrets.PBI_ROT_TV10 }}
          PBI_ROT_TV11: ${{ secrets.PBI_ROT_TV11 }}
          PBI_ROT_TV12: ${{ secrets.PBI_ROT_TV12 }}
          PBI_ROT_TV13: ${{ secrets.PBI_ROT_TV13 }}
          PBI_TV16: ${{ secrets.PBI_TV16 }}
          PBI_TV15: ${{ secrets.PBI_TV15 }}
          PBI_TV14: ${{ secrets.PBI_TV14 }}
          SHOT_KEY: ${{ secrets.SHOT_KEY }}
        run: node capture.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Start the next run 15 minutes after this one began
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAIT=$(( 900 - ( $(date +%s) - START ) ))
          if [ "$WAIT" -gt 0 ]; then echo "Waiting $WAIT seconds"; sleep "$WAIT"; fi
          gh workflow run screenshots.yml --ref main --repo "$GITHUB_REPOSITORY"
